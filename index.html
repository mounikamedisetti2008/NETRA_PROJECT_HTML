
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA Robot Mission Control</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="script.css">
</head>
<body>

    <header class="navbar">

        <!-- Logo -->
        <div class="logo">
            <div class="logo-box">N</div>
            <div class="logo-text">
                <h2>NETRA</h2>
                <span>ROBOT MISSION CONTROL</span>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="navigation">
            <a href="#" class="active">Dashboard</a>
            <a href="#">Fleet</a>
            <a href="#">Telemetry</a>
            <a href="#">Alerts</a>
        </nav>

        <!-- System Status -->
        <div class="status">
            <span class="online-dot"></span>
            <span class="online-text">SYSTEM ONLINE</span>
            <span class="time" id="clock">01:53:10 AM</span>
        </div>

        <!-- Dispatch Button -->
        <button class="dispatch-btn" onclick="dispatchMission()">
            + Dispatch Mission
        </button>

    </header>

    <script src="script.js"></script>

</body>
</html>
